basePath: /
definitions:
  actorsmartbook.Appointment:
    properties:
      css_class:
        description: "@Description\tFärgklass i det kommunala systemet, används för
          att skilja kategorier\n@Example\t\tactorcolor5"
        type: string
      description:
        description: "@Description\tBeskrivning, används av kommunen för att ange
          bokande organisation\n@Example\t\tBergsåkers Badmintonklubb"
        type: string
      duration_minutes:
        description: "@Description\tBookad tid i minuter\n@Example\t\t90"
        type: integer
      encoded_id:
        description: "@Description\tKodad id som används för att anropa boknings-API:t
          med\n@Example\t\teyJWYWx1ZSI6MzM3NjY3LCJUeXBlTmFtZSI6IlN5c3RlbS5JbnQzMiJ9"
        type: string
      end:
        description: "@Description\tSluttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T19:30:00+01:00"
        type: string
      id:
        description: "@Description\tUnik id för bokningen i det kommunala systemet\n@Example\t\t337667"
        type: integer
      location:
        description: "@Description\tSal eller resurs som bokningen avser, utvuxen
          ur ämnet\n@Example\t\tBaldershallen 1"
        type: string
      recurring:
        description: "@Description\tOm bokningen är en del av en återkommande serie\n@Example\t\tfalse"
        type: boolean
      resources:
        description: "@Description\tResurser som bokningen är knuten till"
        items:
          $ref: '#/definitions/actorsmartbook.Resource'
        type: array
      start:
        description: "@Description\tStarttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T18:00:00+01:00"
        type: string
      subject:
        description: "@Description\tÄmne enligt det kommunala systemet, t.ex. \"18:00
          - 19:30 Baldershallen 1\"\n@Example\t\t18:00 - 19:30 Baldershallen 1"
        type: string
      visible:
        description: "@Description\tOm bokningen är synlig i det kommunala bokningssystemet\n@Example\t\ttrue"
        type: boolean
    type: object
  actorsmartbook.AppointmentListResponse:
    properties:
      appointments:
        description: "@Description\tAlla bokningar i perioden"
        items:
          $ref: '#/definitions/actorsmartbook.Appointment'
        type: array
      count:
        description: "@Description\tAntal bokningar i perioden\n@Example\t\t151"
        type: integer
      from:
        description: "@Description\tPeriodens början i lokal tid\n@Example\t\t2026-11-02T00:00:00+01:00"
        type: string
      to:
        description: "@Description\tPeriodens slut i lokal tid\n@Example\t\t2026-11-09T00:00:00+01:00"
        type: string
    type: object
  actorsmartbook.ErrorResponse:
    properties:
      error:
        description: "@Description\tFelmeddelande\n@Example\t\tinvalid time range"
        type: string
    type: object
  actorsmartbook.Resource:
    properties:
      id:
        description: "@Description\tResursens id i det kommunala systemet\n@Example\t\t628"
        type: integer
      name:
        description: "@Description\tResursens namn\n@Example\t\tBaldershallen 1"
        type: string
    type: object
  matchi.BookRequest:
    properties:
      comment:
        description: "@Description\tKommentar som läggs till bokningen\n@Example\t\tTennislaget"
        type: string
      court_name:
        description: "@Description\tNamnet på banan/salen, t.ex. \"1. Tennis - Vasa
          Bryggeri\"\n@Example\t\t1. Tennis - Vasa Bryggeri"
        type: string
      customer_id:
        description: "@Description\tMATCHis kund-id som bokningen görs för\n@Example\t\t1660773"
        type: integer
      end:
        description: "@Description\tSluttid, avrundas uppåt till närmaste halvtimme\n@Example\t\t2026-11-06T13:00:00+01:00"
        type: string
      start:
        description: "@Description\tStarttid, avrundas nedåt till närmaste halvtimme\n@Example\t\t2026-11-06T11:00:00+01:00"
        type: string
      type:
        description: "@Description\tTyp av bokning, t.ex. DEFAULT eller TRAINING\n@Example\t\tDEFAULT"
        type: string
    required:
    - court_name
    - end
    - start
    type: object
  matchi.BookingResult:
    properties:
      booking_id:
        description: "@Description\tMATCHis numeriska boknings-id\n@Example\t\t112291396"
        type: string
      court_name:
        description: "@Description\tNamnet på banan/salen\n@Example\t\t1. Tennis -
          Vasa Bryggeri"
        type: string
      end:
        description: "@Description\tSluttid i lokal tid\n@Example\t\t2026-11-06T13:00:00+01:00"
        type: string
      group_id:
        description: "@Description\tGrupp-id för bokningen, om den spänner flera slotter\n@Example\t\t14003203"
        type: string
      slot_id:
        description: "@Description\tMATCHis slot-id för den första slotten i bokningen\n@Example\t\t4a66b2f0-3177-4c9c-a7a5-3a54e44a9737"
        type: string
      slot_ids:
        description: "@Description\tDe slotter som bokades\n@Example\t\t[\"4a66b2f0-3177-4c9c-a7a5-3a54e44a9737\"]"
        items:
          type: string
        type: array
      start:
        description: "@Description\tStarttid i lokal tid\n@Example\t\t2026-11-06T11:00:00+01:00"
        type: string
    type: object
  matchi.CancelRequest:
    properties:
      slot_ids:
        description: "@Description\tMATCHis slot-id:n för de bokningar som ska avbokas\n@Example\t\t[\"4a66b2f0-3177-4c9c-a7a5-3a54e44a9737\"]"
        items:
          type: string
        type: array
    required:
    - slot_ids
    type: object
  matchi.ErrorResponse:
    properties:
      error:
        description: "@Description\tFelmeddelande\n@Example\t\tinvalid time range"
        type: string
    type: object
  matchi.MoveRequest:
    properties:
      court_name:
        description: "@Description\tNamnet på banan/salen, om bokningen ska flyttas
          till en annan bana\n@Example\t\t1. Tennis - Vasa Bryggeri"
        type: string
      end:
        description: "@Description\tNy sluttid, avrundas uppåt till närmaste halvtimme\n@Example\t\t2026-11-06T13:00:00+01:00"
        type: string
      slot_id:
        description: "@Description\tMATCHis slot-id för den bokning som ska flyttas\n@Example\t\t2a432de2-551d-4f05-8111-23c23b2b04bf"
        type: string
      start:
        description: "@Description\tNy starttid, avrundas nedåt till närmaste halvtimme\n@Example\t\t2026-11-06T11:00:00+01:00"
        type: string
    required:
    - end
    - slot_id
    - start
    type: object
  matchi.Schedule:
    properties:
      slots:
        description: "@Description\tDe bokade eller fria slotterna i schemaordning"
        items:
          $ref: '#/definitions/matchi.Slot'
        type: array
    type: object
  matchi.Slot:
    properties:
      bookable:
        description: "@Description\tOm slotten går att boka (tidsavvikelse eller stängd
          tid gör den obokbar)\n@Example\t\ttrue"
        type: boolean
      booking_id:
        description: "@Description\tMATCHis numeriska boknings-id\n@Example\t\t112291396"
        type: string
      court_name:
        description: "@Description\tNamnet på banan/salen som slotten tillhör\n@Example\t\t1.
          Tennis - Vasa Bryggeri"
        type: string
      end:
        description: "@Description\tSluttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-06T07:30:00+01:00"
        type: string
      free:
        description: "@Description\tOm slotten är obokad\n@Example\t\ttrue"
        type: boolean
      group_id:
        description: "@Description\tGrupp-id som sammanlänkar slotter till samma bokning\n@Example\t\t14003203"
        type: string
      slot_id:
        description: "@Description\tMATCHis interna id för slotten\n@Example\t\t4a66b2f0-3177-4c9c-a7a5-3a54e44a9737"
        type: string
      start:
        description: "@Description\tStarttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-06T07:00:00+01:00"
        type: string
      status:
        description: "@Description\tBokningsstatus, t.ex. OK, PENDING eller PARTLY\n@Example\t\tOK"
        type: string
      title:
        description: "@Description\tÖvrig information om slotten, t.ex. kundnamn\n@Example\t\tSTK
          Verksamhet"
        type: string
    type: object
  occupancy.Booking:
    properties:
      appointment_id:
        description: "@Description\tId:t för bokningen i det kommunala bokningssystemet\n@Example\t\t337667"
        type: integer
      court_name:
        description: "@Description\tMATCHi-banan eller salen som bokningen gäller\n@Example\t\t1.
          Idrottshall"
        type: string
      end:
        description: "@Description\tSluttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T19:30:00+01:00"
        type: string
      location:
        description: "@Description\tResursen i det kommunala bokningssystemet\n@Example\t\tBaldershallen
          1"
        type: string
      matchi_booking_id:
        description: "@Description\tMATCHis boknings-id\n@Example\t\t112291396"
        type: string
      matchi_end:
        description: "@Description\tSluttid för bokningen i MATCHi\n@Example\t\t2026-11-02T19:30:00+01:00"
        type: string
      matchi_start:
        description: "@Description\tStarttid för bokningen i MATCHi\n@Example\t\t2026-11-02T18:00:00+01:00"
        type: string
      matchi_title:
        description: "@Description\tInformation om bokningen i MATCHi, t.ex. kundnamn\n@Example\t\tSTK
          Verksamhet"
        type: string
      start:
        description: "@Description\tStarttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T18:00:00+01:00"
        type: string
    type: object
  occupancy.Result:
    properties:
      booked:
        description: "@Description\tBokningarna som även är bokade i MATCHi"
        items:
          $ref: '#/definitions/occupancy.Booking'
        type: array
      count:
        description: "@Description\tAntal bokningar som även är bokade i MATCHi\n@Example\t\t3"
        type: integer
      errors:
        description: "@Description\tMeddelanden om dagar som inte kunde läsas från
          MATCHi\n@Example\t\t[\"2026-11-03: kunde inte läsa schemat\"]"
        items:
          type: string
        type: array
      from:
        description: "@Description\tPeriodens början i lokal tid\n@Example\t\t2026-11-02T00:00:00+01:00"
        type: string
      to:
        description: "@Description\tPeriodens slut i lokal tid\n@Example\t\t2026-11-09T00:00:00+01:00"
        type: string
    type: object
  store.Booking:
    properties:
      created_at:
        description: "@Description\tTidpunkten när raden skapades\n@Example\t\t2026-11-06T10:00:00Z"
        type: string
      end_time:
        description: "@Description\tSluttid i lokal tid\n@Example\t\t2026-11-06T13:00:00+01:00"
        type: string
      kommun_appointment_id:
        description: "@Description\tId i det kommunala bokningssystemet\n@Example\t\t351930"
        type: integer
      kommun_resource_id:
        description: "@Description\tResursens id i det kommunala bokningssystemet\n@Example\t\t631"
        type: integer
      matchi_booking_id:
        description: "@Description\tMATCHis numeriska boknings-id\n@Example\t\t112291396"
        type: string
      matchi_court_id:
        description: "@Description\tMATCHis id för banan eller salen\n@Example\t\t3622"
        type: integer
      matchi_slot_id:
        description: "@Description\tMATCHis slot-id för bokningen\n@Example\t\t4a66b2f0-3177-4c9c-a7a5-3a54e44a9737"
        type: string
      start_time:
        description: "@Description\tStarttid i lokal tid\n@Example\t\t2026-11-06T11:00:00+01:00"
        type: string
      status:
        description: "@Description\tStatus för bokningen, t.ex. synced\n@Example\t\tsynced"
        type: string
      updated_at:
        description: "@Description\tTidpunkten när raden senast ändrades\n@Example\t\t2026-11-06T10:00:00Z"
        type: string
    type: object
  store.CourtMapping:
    properties:
      kommun_resource_id:
        description: "@Description\tResursens id i det kommunala bokningssystemet\n@Example\t\t628"
        type: integer
      kommun_resource_name:
        description: "@Description\tResursens namn i det kommunala bokningssystemet\n@Example\t\tBaldershallen
          1"
        type: string
      matchi_court_id:
        description: "@Description\tMATCHis id för banan eller salen\n@Example\t\t3622"
        type: integer
      matchi_court_name:
        description: "@Description\tMATCHis namn för banan eller salen\n@Example\t\t1.
          Tennis - Vasa Bryggeri"
        type: string
    type: object
  sync.ErrorResponse:
    properties:
      error:
        description: "@Description\tFelmeddelande\n@Example\t\tinvalid time range"
        type: string
    type: object
  sync.LinkRequest:
    properties:
      appointment_id:
        description: "@Description\tId:t för bokningen i det kommunala bokningssystemet\n@Example\t\t337667"
        type: integer
      end:
        description: "@Description\tSluttid för bokningen i det kommunala systemet\n@Example\t\t2026-11-02T19:30:00+01:00"
        type: string
      matchi_court_id:
        description: "@Description\tMATCHis id för banan eller salen. Kan utelämnas
          om resursen\nbara är kopplad till en enda bana.\n@Example\t\t11344"
        type: integer
      start:
        description: "@Description\tStarttid för bokningen i det kommunala systemet\n@Example\t\t2026-11-02T18:00:00+01:00"
        type: string
    required:
    - appointment_id
    - end
    - start
    type: object
  sync.LinkResult:
    properties:
      appointment_id:
        description: "@Description\tId:t för bokningen i det kommunala bokningssystemet\n@Example\t\t337667"
        type: integer
      court_name:
        description: "@Description\tMATCHi-banan eller salen som bokades\n@Example\t\t1.
          Idrottshall"
        type: string
      end:
        description: "@Description\tSluttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T19:30:00+01:00"
        type: string
      location:
        description: "@Description\tResursen i det kommunala bokningssystemet\n@Example\t\tBaldershallen
          1"
        type: string
      matchi_booking_id:
        description: "@Description\tMATCHis boknings-id\n@Example\t\t112291396"
        type: string
      matchi_slot_id:
        description: "@Description\tMATCHis slot-id för bokningen\n@Example\t\t4a66b2f0-3177-4c9c-a7a5-3a54e44a9737"
        type: string
      start:
        description: "@Description\tStarttid i lokal tid (Europe/Stockholm)\n@Example\t\t2026-11-02T18:00:00+01:00"
        type: string
    type: object
  sync.Report:
    properties:
      created:
        description: "@Description\tAntal bokningar som skapades i MATCHi\n@Example\t\t3"
        type: integer
      errors:
        description: "@Description\tFel som uppstod under synkroniseringen"
        items:
          type: string
        type: array
      from:
        description: "@Description\tPeriodens början i lokal tid\n@Example\t\t2026-11-06T00:00:00+01:00"
        type: string
      moved:
        description: "@Description\tAntal bokningar som flyttades i MATCHi\n@Example\t\t1"
        type: integer
      orphans:
        description: "@Description\tAntal bokningar i databasen som inte längre finns
          i det kommunala systemet\n@Example\t\t0"
        type: integer
      skipped:
        description: "@Description\tAntal bokningar i det kommunala systemet som hoppades
          över\n@Example\t\t5"
        type: integer
      to:
        description: "@Description\tPeriodens slut i lokal tid\n@Example\t\t2026-11-27T00:00:00+01:00"
        type: string
      unchanged:
        description: "@Description\tAntal bokningar som var oförändrade\n@Example\t\t42"
        type: integer
    type: object
info:
  contact: {}
  description: API for repo-template project
  title: Repo Template API
  version: "1.0"
paths:
  /actorsmartbook/appointments:
    get:
      consumes:
      - application/json
      description: Returnerar alla bokningar i det kommunala bokningssystemet (Actor
        Smartbook) för en given period. Tiderna returneras i lokal tid (Europe/Stockholm).
      parameters:
      - default: now
        description: Periodens början (RFC3339, YYYY-MM-DD eller 'now')
        in: query
        name: from
        type: string
      - default: now+7d
        description: Periodens slut (RFC3339, YYYY-MM-DD eller 'now+7d')
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/actorsmartbook.AppointmentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/actorsmartbook.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/actorsmartbook.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/actorsmartbook.ErrorResponse'
      summary: Hämta bokningar från det kommunala bokningssystemet
      tags:
      - actorsmartbook
  /bookings:
    get:
      consumes:
      - application/json
      description: Returnerar de bokningar som speglats mellan det kommunala bokningssystemet
        och MATCHi.
      parameters:
      - default: now
        description: Periodens början (RFC3339 eller YYYY-MM-DD)
        in: query
        name: from
        type: string
      - default: now+21d
        description: Periodens slut (RFC3339 eller YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Booking'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sync.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sync.ErrorResponse'
      summary: Lista synkade bokningar
      tags:
      - sync
  /court-mappings:
    get:
      consumes:
      - application/json
      description: Returnerar alla kopplingar som används vid synkroniseringen.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.CourtMapping'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sync.ErrorResponse'
      summary: Lista kopplingar mellan kommunresurser och MATCHi-banor
      tags:
      - sync
    post:
      consumes:
      - application/json
      description: Kopplar en resurs i det kommunala bokningssystemet till en bana
        eller sal i MATCHi.
      parameters:
      - description: Koppling
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.CourtMapping'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.CourtMapping'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sync.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sync.ErrorResponse'
      summary: Skapa eller uppdatera en koppling
      tags:
      - sync
  /health:
    get:
      description: Returns the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /hello:
    get:
      description: Returns a hello message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hello world
      tags:
      - greeting
  /matchi/bookings:
    get:
      consumes:
      - application/json
      description: Returnerar de bokningar i det kommunala bokningssystemet som även
        är bokade i MATCHi. Anropet är skrivläsande - det bokar aldrig något i MATCHi.
      parameters:
      - default: now
        description: Periodens början (RFC3339, YYYY-MM-DD eller 'now')
        in: query
        name: from
        type: string
      - default: now+7d
        description: Periodens slut (RFC3339, YYYY-MM-DD eller 'now+7d')
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/occupancy.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/actorsmartbook.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/actorsmartbook.ErrorResponse'
      summary: Markera tider som är bokade i MATCHi
      tags:
      - matchi
    post:
      consumes:
      - application/json
      description: Bookar en tid på en bana eller sal. Starttid avrundas nedåt till
        närmaste halvtimme och sluttid avrundas uppåt till närmaste halvtimme.
      parameters:
      - description: Bokning
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/matchi.BookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/matchi.BookingResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/matchi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/matchi.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/matchi.ErrorResponse'
      summary: Boka en tid i MATCHi
      tags:
      - matchi
  /matchi/bookings/cancel:
    post:
      consumes:
      - application/json
      description: Avbokar en bokning utan återbetalning och utan notis till kunden.
      parameters:
      - description: Avbokning
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/matchi.CancelRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/matchi.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/matchi.ErrorResponse'
      summary: Avboka en bokning i MATCHi
      tags:
      - matchi
  /matchi/bookings/link:
    post:
      consumes:
      - application/json
      description: Bokar en tid i MATCHi för en bokning i det kommunala bokningssystemet
