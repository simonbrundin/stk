apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api
          image: go-api:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          env:
            - name: APP_VERSION
              value: "dev"
            - name: API_HOST
              value: ""
            - name: CORS_ORIGINS
              value: "*"
            - name: MATCHI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: go-api-secrets
                  key: matchi-username
            - name: MATCHI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-api-secrets
                  key: matchi-password
            - name: ACTORSMARTBOOK_BASE_URL
              value: "https://sundsvall.actorsmartbook.se"
            - name: ACTORSMARTBOOK_RESOURCE_FILTER
              value: "628,629,630,631,632,751,633,634,635,636,637"
            - name: MATCHI_CUSTOMER_ID
              value: "1660773"
            - name: SYNC_DAYS
              value: "21"
            # Tomt filter speglar ALL bokningar for de mappade resurserna.
            # Satt en regex (t.ex. "Sundsvalls Tennisklubb") for att begransa
            # vilka organisationers bokningar som hamnar i MATCHi.
            - name: SYNC_ORGANIZATION_FILTER
              value: ""
            - name: SYNC_REMOVE_ORPHANS
              value: "false"
