# DO NOT EDIT MANUALLY
# Dev database configuration.
#
# Dev kör mot Neon (Lakebase Postgres) - det finns ingen Postgres i klustret.
# Anslutningssträngarna kommer ur neon.env, som gitignoras och måste finnas
# innan `kustomize build`/`tilt up` (se ./README.md).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: repo-template

resources:
  - ../../base/db

# Secret med Neon-anslutningarna. Nycklarna:
#   DATABASE_URL / DATABASE_URL_UNPOOLED - appen (poolad resp. direkt)
#   uri                                 - Atlas (direkt endpoint)
#   devURL                              - Atlas dev-database
secretGenerator:
  - name: repo-template-db-neon
    envs:
      - neon.env
    options:
      disableNameSuffixHash: true

patches:
  - target:
      group: db.atlasgo.io
      version: v1alpha1
      kind: AtlasSchema
      name: repo-template-db-schema
    patch: |-
      - op: replace
        path: /spec/urlFrom/secretKeyRef/name
        value: repo-template-db-neon
      - op: replace
        path: /spec/urlFrom/secretKeyRef/key
        value: uri
