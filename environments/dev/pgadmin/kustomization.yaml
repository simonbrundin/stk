# DO NOT EDIT MANUALLY
# pgAdmin for dev environment
#
# pgadmin-values.yaml genereras ur environments/dev/db/neon.env och
# pgadmin-values.base.yaml av environments/dev/db/sync-neon-env.sh.
# Den gitignoras - kör synkningen innan `kustomize build`/`tilt up`.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: pgadmin4
    repo: https://helm.runix.net
    version: "1.70.4"
    releaseName: pgadmin4
    namespace: repo-template
    valuesFile: ./pgadmin-values.yaml
